name: Run WAQI Data Collector

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  collect-data:
    runs-on: ubuntu-latest
    
  permissions:
      contents: write  # Дает роботу право пушить изменения в репозиторий
    steps:
      - name: Checkout repository
        
    steps:
    
    - name: Checkout repository
      uses: actions/checkout@v4

    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    
    - name: Run script
      env:
        WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
      run: python script.py

    
    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add data.csv buffer.json || true
        git commit -m "Auto-update data: $(date -u +'%Y-%m-%d %H:%M:%S') UTC" || true
        git push
